[project]
name = "conversational_flow_example"
version = "0.1.0"
description = "conversational_flow_example using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.20,<2.0.0",
    "exa-py>=2.20.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
kickoff = "conversational_flow_example.main:kickoff"
run_crew = "conversational_flow_example.main:kickoff"
plot = "conversational_flow_example.main:plot"
run_with_trigger = "conversational_flow_example.main:run_with_trigger"
chat = "chat_ui.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conversational_flow_example", "chat_ui"]

[tool.crewai]
type = "flow"
project_id = "da7a2183-a23c-4316-8ca1-b8fa744fd1d0"
